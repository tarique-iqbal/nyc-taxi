name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug logging"
        required: false
        default: "false"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Override .env values for the CI environment.
  # Services run inside the docker-compose network on their default ports.
  KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  KAFKA_TOPIC: nyc-taxi-trips
  KAFKA_DLQ_TOPIC: nyc-taxi-trips-dlq
  KAFKA_CONSUMER_GROUP_ID: nyc-taxi-etl-consumer
  KAFKA_BATCH_SIZE: "100"
  KAFKA_BATCH_TIMEOUT_SECONDS: "5"
  CLICKHOUSE_HOST: localhost
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_DB: taxi
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ""
  PROMETHEUS_PORT_PRODUCER: "9100"
  PROMETHEUS_PORT_CONSUMER: "9101"
  HEALTH_PORT: "8000"
  LOG_LEVEL: WARNING
  ZONE_LOOKUP_PATH: tests/fixtures/taxi_zone_lookup.csv
  REJECTED_DIR: /tmp/rejected
  PARQUET_FILE_PATH: tests/fixtures/sample_trips.parquet
  PARQUET_BATCH_SIZE: "100"

jobs:

  integration-tests:
    name: Integration tests (Kafka + ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Python
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Infrastructure
      - name: Start Docker Compose services
        run: docker compose up -d

      - name: Wait for ClickHouse
        timeout-minutes: 3
        run: |
          until docker compose exec -T clickhouse \
              clickhouse-client --query "SELECT 1" >/dev/null 2>&1; do
            echo "Waiting for ClickHouse..."
            sleep 3
          done
          echo "ClickHouse ready"

      - name: Wait for Kafka
        timeout-minutes: 3
        run: |
          until docker compose exec -T kafka \
              kafka-broker-api-versions \
              --bootstrap-server kafka:29092 >/dev/null 2>&1; do
            echo "Waiting for Kafka..."
            sleep 3
          done
          echo "Kafka ready"

      # Schema and topics
      - name: Apply ClickHouse schema
        run: bash scripts/apply_schema.sh

      - name: Create Kafka topics
        run: bash scripts/create_topics.sh

      # Smoke test
      - name: Smoke test (infrastructure check)
        run: |
          python3 -c "
          from etl.config.settings import get_settings
          from etl.infrastructure.clickhouse.client import ClickHouseClient
          s = get_settings()
          ch = ClickHouseClient(
              host=s.clickhouse.host, port=s.clickhouse.port,
              database=s.clickhouse.database,
              user=s.clickhouse.user, password=s.clickhouse.password,
          )
          ch.ping()
          print('ClickHouse: OK')
          from confluent_kafka.admin import AdminClient
          a = AdminClient({'bootstrap.servers': s.kafka.bootstrap_servers})
          a.list_topics(timeout=5)
          print('Kafka: OK')
          "

      # Integration tests
      - name: Run integration tests
        env:
          LOG_LEVEL: ${{ github.event.inputs.debug == 'true' && 'DEBUG' || 'WARNING' }}
        run: |
          pytest tests/integration/ \
            -m integration \
            --no-cov \
            -v \
            --tb=short \
            --timeout=60

      # Diagnostics on failure
      - name: Show ClickHouse logs on failure
        if: failure()
        run: docker compose logs clickhouse --tail=50

      - name: Show Kafka logs on failure
        if: failure()
        run: docker compose logs kafka --tail=50

      - name: Show rejected files on failure
        if: failure()
        run: |
          echo "Rejected files"
          ls -lh /tmp/rejected/ 2>/dev/null || echo "None"
          find /tmp/rejected -name "*.jsonl.gz" -exec sh -c '
            echo "--- $1 ---"
            python3 -c "
          from etl.utils.compression import read_jsonl_gz
          from pathlib import Path
          import json
          for r in read_jsonl_gz(Path(\"$1\")):
              print(json.dumps(r, indent=2, default=str))
            "
          ' _ {} \; 2>/dev/null || true

      # Teardown
      - name: Stop Docker Compose services
        if: always()
        run: docker compose down --volumes
